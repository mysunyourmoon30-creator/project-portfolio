name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clone
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TotalWeightPlc.slnx

      - name: Build
        run: dotnet build TotalWeightPlc.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TotalWeightPlc.slnx --no-build --configuration Release
